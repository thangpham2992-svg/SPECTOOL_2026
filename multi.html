<script id="mr-scroll-start-fix">
// New initial opening starts at the top. Keep user-controlled scrolling on subsequent model changes.
(function(){
 if('scrollRestoration' in history)history.scrollRestoration='manual';
 let userMoved=false,done=false;
 const mark=()=>{userMoved=true};
 ['wheel','touchstart','pointerdown','keydown'].forEach(type=>window.addEventListener(type,mark,{once:true,passive:true}));
 const reset=()=>{if(!userMoved&&!done)window.scrollTo(0,0)};
 reset();
 document.addEventListener('DOMContentLoaded',reset,{once:true});
 window.addEventListener('load',()=>{if(!userMoved){window.scrollTo(0,0);requestAnimationFrame(()=>{if(!userMoved)window.scrollTo(0,0)})}done=true},{once:true});
})();
</script>

(() => {
  if (window.top !== window.self) return;
  const phone = matchMedia('(max-width: 740px) and (pointer: coarse), (max-height: 500px) and (max-width: 960px) and (pointer: coarse)');
  const viewport = document.querySelector('meta[name="viewport"]');
  const initialViewport = viewport.content;
  const manifest = document.createElement('link');
  manifest.rel = 'manifest';
  manifest.href = 'mobile.webmanifest';
  function updateMobileMode() {
    if (phone.matches) {
      if (!manifest.isConnected) document.head.append(manifest);
      viewport.content = initialViewport + ', viewport-fit=cover';
    } else {
      manifest.remove();
      viewport.content = initialViewport;
    }
  }
  updateMobileMode();
  phone.addEventListener('change', updateMobileMode);
  document.addEventListener('DOMContentLoaded', () => {
    const button = document.querySelector('.phone-fullscreen');
    const installed = matchMedia('(display-mode: fullscreen)');
    const standalone = matchMedia('(display-mode: standalone)');
    function refresh() {
      const active = Boolean(document.fullscreenElement);
      button.hidden = !phone.matches || !document.fullscreenEnabled || (installed.matches && !active);
      button.title = active ? 'Thoát toàn màn hình' : 'Toàn màn hình';
      button.setAttribute('aria-label', button.title);
      button.setAttribute('aria-pressed', String(active));
    }
    button.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        alert('Trình duyệt chưa cho phép bật toàn màn hình.');
      }
    });
    const summary = document.querySelector('.summary-tab');
    if (summary) summary.addEventListener('click', event => {
      if (phone.matches && (installed.matches || standalone.matches || document.fullscreenElement)) {
        event.preventDefault();
        location.assign(summary.href);
      }
    });
    phone.addEventListener('change', refresh);
    installed.addEventListener('change', refresh);
    document.addEventListener('fullscreenchange', refresh);
    refresh();
  });
})();
</script>
